{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center h-100 align-items-center">
    <div class="col-md-5">
        <div class="glass-card p-5 slide-in">
            <h2 class="text-center mb-4 text-white fw-bold"><i class="fa-solid fa-user-plus text-primary"></i> Register</h2>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label text-secondary">Full Name</label>
                    <input type="text" name="name" class="form-control form-control-lg" required placeholder="John Doe">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Email address</label>
                    <input type="email" name="email" class="form-control form-control-lg" required placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold">Sign Up</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-secondary">Already have an account? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
