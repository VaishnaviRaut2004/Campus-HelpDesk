{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center h-100 align-items-center">
    <div class="col-md-5">
        <div class="glass-card p-5 slide-in">
            <h2 class="text-center mb-4 text-white fw-bold"><i class="fa-solid fa-key text-info"></i> Forgot Password</h2>
            <p class="text-center text-secondary mb-4">Enter your registered username below to reset your password securely.</p>
            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label text-secondary">Full Name / Username</label>
                    <input type="text" name="name" class="form-control form-control-lg" required placeholder="John Doe">
                </div>
                <button type="submit" class="btn btn-info btn-lg w-100 rounded-pill fw-bold text-dark">Verify User</button>
            </form>
            <div class="text-center mt-4">
                <a href="{{ url_for('login') }}" class="text-secondary text-decoration-none"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
