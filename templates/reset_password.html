{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center h-100 align-items-center">
    <div class="col-md-5">
        <div class="glass-card p-5 slide-in">
            <h2 class="text-center mb-4 text-white fw-bold"><i class="fa-solid fa-lock-open text-success"></i> Reset Password</h2>
            <p class="text-center text-secondary mb-4">Resetting password for <strong>{{ user.name }}</strong></p>
            <form action="{{ url_for('reset_password', token=token) }}" method="POST">
                <div class="mb-4">
                    <label class="form-label text-secondary">New Password</label>
                    <div class="input-group">
                        <input type="password" id="new_password" name="password" class="form-control form-control-lg" required placeholder="••••••••">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new_password', this)"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Confirm New Password</label>
                    <div class="input-group">
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control form-control-lg" required placeholder="••••••••">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm_password', this)"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold">Update Password</button>
            </form>
            <div class="text-center mt-4">
                <a href="{{ url_for('login') }}" class="text-secondary text-decoration-none">Cancel</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = "password";
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
